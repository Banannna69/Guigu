# docker-publish.yml：打 tag 时自动构建并发布镜像到 GitHub Container Registry。
#
# 为什么用 ghcr 而不是 Docker Hub：镜像与代码在同一个平台，权限走仓库的
# GITHUB_TOKEN，不需要额外配置 secrets；公开仓库的镜像是公开的，私有仓库的
# 镜像也自动私有，可见性与代码天然对齐。
#
# 触发方式：
#   git tag v1.0.0 && git push origin v1.0.0    → 发布 1.0.0 / 1.0 / latest
#   手动触发（Actions 页面 Run workflow）        → 只发布 edge
name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx 让一次构建能同时产出 amd64 与 arm64。
      # 渗透测试经常在 ARM 的云主机或 Apple Silicon 上跑，只发 amd64 会让
      # 那部分用户拿到「镜像架构不匹配」的报错。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签策略：
      #   v1.2.3 → 1.2.3 / 1.2 / 1 / latest
      #   手动触发 → edge（便于测未发布的改动）
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GUIGU_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建耗时较长，把镜像 digest 打到任务摘要里方便直接复制引用。
      - name: 输出摘要
        run: |
          echo "### 已发布镜像" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
